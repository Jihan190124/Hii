<!DOCTYPE html>
<html>
<head>
    <title>Student Info Combined</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        /* Without Bootstrap section */
        .no-bootstrap {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<!-- WITHOUT BOOTSTRAP -->
<div class="no-bootstrap">
    <div class="box">
        <h2>Without Bootstrap</h2>
        <h1>Jihan Bhagat</h1>
        <h4>Enrollment No: 254510331010</h4>
        <h4>Department: Computer Science and Engineering</h4>
        <h4>College: SIDD</h4>
    </div>
</div>

<!-- WITH BOOTSTRAP -->
<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="text-center bg-white p-4 rounded shadow">
        <h2>With Bootstrap</h2>
        <h1>Jihan Bhagat</h1>
        <h4>Enrollment No: 254510331010</h4>
        <h4>Department: Computer Science and Engineering</h4>
        <h4>College: SIDD</h4>
    </div>
</div>

</body>
</html>
